<mat-toolbar color="primary" class="mat-elevation-z4 toolbar">

  <!-- Logo -->
  <a
    mat-button
    routerLink="/app/home"
    class="brand">

    Mariscos 🍤
  </a>

  <ng-container *ngIf="authService.isLoggedIn()">

    <!-- Menú -->
    <div class="menu">

      <a
        mat-button
        routerLink="/app/dashboard"
        routerLinkActive="active-link">
        Dashboard
      </a>

      <a
        mat-button
        *ngIf="authService.isAdmin()"
        routerLink="/app/pedidos"
        routerLinkActive="active-link">
        Pedidos
      </a>

      <a
        mat-button
        *ngIf="authService.isAdmin()"
        routerLink="/app/productos"
        routerLinkActive="active-link">
        Productos
      </a>

      <a
        mat-button
        *ngIf="authService.isAdmin()"
        routerLink="/app/categorias"
        routerLinkActive="active-link">
        Categorías
      </a>

      <a
        mat-button
        *ngIf="authService.isAdmin()"
        routerLink="/app/clientes"
        routerLinkActive="active-link">
        Clientes
      </a>

    </div>

    <!-- Empuja usuario y logout a la derecha -->
    <span class="spacer"></span>

    <span class="user-info">
      Bienvenido,
      <strong>{{ authService.getSession()?.nombre }}</strong>
    </span>

    <button
      mat-stroked-button
      color="warn"
      (click)="onLogout()">
      Cerrar Sesión
    </button>

  </ng-container>

</mat-toolbar>

<router-outlet></router-outlet>
