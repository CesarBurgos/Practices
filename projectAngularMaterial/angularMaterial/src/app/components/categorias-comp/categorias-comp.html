<div class="categorias-container">
  <h2 class="titulo">Administración de Categorías 📁</h2>

  <div class="layout">

    <!-- Formulario -->
    <div class="form-section">
      <mat-card>
        <mat-card-content>

          <h5>{{ editando ? 'Editar' : 'Nueva' }} Categoría</h5>

          <form (ngSubmit)="onSubmit()">

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Nombre</mat-label>
              <input
                matInput
                type="text"
                [(ngModel)]="categoriaForm.nombre"
                name="nombres"
                required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Descripción</mat-label>
              <textarea
                matInput
                rows="3"
                [(ngModel)]="categoriaForm.descripcion"
                name="descripcion">
              </textarea>
            </mat-form-field>

            <button
              mat-raised-button
              color="primary"
              type="submit"
              class="full-width">
              {{ editando ? 'Actualizar' : 'Guardar' }}
            </button>

            <button
              mat-stroked-button
              type="button"
              class="full-width"
              (click)="limpiarForm()"
              *ngIf="editando">
              Cancelar
            </button>

          </form>

        </mat-card-content>
      </mat-card>
    </div>

    <!-- Tabla -->
    <div class="table-section">
      <mat-card>
        <mat-card-content>

          <table
            mat-table
            [dataSource]="categorias"
            class="full-width">

            <!-- ID -->
            <ng-container matColumnDef="idCategoria">
              <th mat-header-cell *matHeaderCellDef>ID</th>
              <td mat-cell *matCellDef="let cat">
                {{ cat.idCategoria }}
              </td>
            </ng-container>

            <!-- Nombre -->
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef>Nombre</th>
              <td mat-cell *matCellDef="let cat">
                <strong>{{ cat.nombre }}</strong>
              </td>
            </ng-container>

            <!-- Descripción -->
            <ng-container matColumnDef="descripcion">
              <th mat-header-cell *matHeaderCellDef>Descripción</th>
              <td mat-cell *matCellDef="let cat">
                {{ cat.descripcion }}
              </td>
            </ng-container>

            <!-- Acciones -->
            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef>Acciones</th>
              <td mat-cell *matCellDef="let cat">

                <button
                  mat-icon-button
                  color="primary"
                  (click)="seleccionarEditar(cat)">
                  <mat-icon>edit</mat-icon>
                </button>

                <button
                  mat-icon-button
                  color="warn"
                  (click)="eliminar(cat.idCategoria)">
                  <mat-icon>delete</mat-icon>
                </button>

              </td>
            </ng-container>

            <tr
              mat-header-row
              *matHeaderRowDef="['idCategoria', 'nombre', 'descripcion', 'acciones']">
            </tr>

            <tr
              mat-row
              *matRowDef="let row; columns: ['idCategoria', 'nombre', 'descripcion', 'acciones']">
            </tr>

          </table>

        </mat-card-content>
      </mat-card>
    </div>

  </div>
</div>
